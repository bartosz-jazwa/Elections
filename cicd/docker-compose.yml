version: "3.9"

########################################################################################################################
#
# These are deployment steps for docker compose:
# 1. Used for both: offsite and GitLab CI/CD deployments.
# 2. This configuration is also used to set up deployment variables for containers.
#
########################################################################################################################

services:

  elections-postgresql:
    image: elections-postgresql
    container_name: elections-postgresql
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 3GB
    build:
      context: ./../elections-postgresql
      dockerfile: Dockerfile.elections
    environment:
      - PGUSER=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
#    logging:
#      driver: "json-file"
#      options:
#        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"
#        max-size: 10m
#        max-file: "3"
#    labels:
#      - "io.portainer.accesscontrol.public"
#    healthcheck:
#      test: [ "CMD-SHELL", "pg_isready", "-d", "suda_sudian" ]
#      interval: 30s
#      timeout: 60s
#      retries: 5
#      start_period: 80s
    ports:
      - '5444:5432'
    networks:
      - elections_network
    volumes:
      - sudian_postgresql_v16_data:/var/lib/postgresql/data
    command: |
      postgres
        -c checkpoint_completion_target=0.9
        -c default_statistics_target=400
        -c effective_io_concurrency=200
        -c random_page_cost=1.0
        -c 'max_connections=${SUDIAN_SERVER_POSTGRESQL_MAX_CONNECTIONS}'

  sudian-proxy:
    image: nginx:1.27.2-alpine-otel
    container_name: sudian-proxy-${TAG}
    healthcheck:
      test: "exit 0"
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M
    # Including whole env file instead of listing all the environment values in "environment" section
    env_file: .env.${TAG}
    environment:
      DOLLAR: $$
    # Rewriting NGINX configuration to substitute variables with values and produce final configuration file
    command: /bin/sh -c "envsubst < /etc/nginx/templates/nginx.conf.template > /etc/nginx/nginx.conf && envsubst < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    logging:
      driver: "json-file"
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"
    labels:
      - "io.portainer.accesscontrol.public"
    ports:
      - "${PROXY_EXPOSED_PORT}:${PROXY_INTERNAL_PORT}"
    volumes:
      - ../sudian-proxy/nginx/nginx.conf:/etc/nginx/templates/nginx.conf.template
      - ../sudian-proxy/nginx/ide.conf:/etc/nginx/templates/default.conf.template
      - ../sudian-proxy/nginx/x-forwarded-for.tt.conf:/etc/nginx/conf.d/x-forwarded-for.tt.conf
    networks:
      - sudian_network
    depends_on:
      - sudian-keycloak
      - sudian-minio


  sudian-analytics-v2-postgresql-v16:
    image: ${SUDIAN_ANALYTICS_V2_IMAGE_PATH}sudian-analytics-v2-postgresql-v16:${TAG}
    container_name: sudian-analytics-v2-postgresql-v16-${TAG}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.75'
          memory: 5G
    shm_size: 4g
    build:
      context: ./../../sudian-analitics/sudian-analytics-postgresql-v16
      dockerfile: Dockerfile.${TAG}
    environment:
      - PGUSER=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    labels:
      - "io.portainer.accesscontrol.public"
    logging:
      driver: "json-file"
      options:
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready", "-d", "sudian_analysis" ]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s
    ports:
      - '5434:5432'
    networks:
      - sudian_network
    volumes:
      - sudian_analytics_v2_postgresql_v16_data:/var/lib/postgresql/data
    command: |
      postgres
        -c checkpoint_completion_target=0.9
        -c default_statistics_target=400
        -c effective_io_concurrency=200
        -c random_page_cost=1.0
        -c 'max_connections=${SUDIAN_ANALITICS_POSTGRESQL_MAX_CONNECTIONS}'

  sudian-elastic-sources:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    container_name: sudian-elastic-sources-${TAG}
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2.5G
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:${ES_PORT}/_cat/health || exit 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 10
    volumes:
      - sudian_elastic_sources_search_data:/usr/share/elasticsearch/data
      - sudian_elastic_sources_certs:/usr/share/elasticsearch/config/certificates
      - sudian_elastic_backup:/opt/elasticsearch/backup
    ports:
      - ${ES_PORT}:9200
      - 9300:9300
    networks:
      - sudian_network
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ELASTIC_USERNAME=${ELASTIC_USERNAME:-elastic}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - xpack.security.http.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - http.cors.enabled=true
      - http.cors.allow-origin=http://localhost:8080
      - path.repo=/opt/elasticsearch/backup

  sudian-kibana:
    depends_on:
      - sudian-elastic-sources
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION}
    container_name: sudian-kibana-${TAG}
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    healthcheck:
      test: "exit 0"
    volumes:
      - sudian_kibana_data:/usr/share/kibana/data
    ports:
      - ${KIBANA_PORT}:5601
    networks:
      - sudian_network
    environment:
      - ELASTICSEARCH_HOSTS=http://sudian-elastic-sources-${TAG}:9200

  sudian-minio:
    image: minio/minio:RELEASE.2024-06-06T09-36-42Z
    container_name: sudian-minio-${TAG}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: server /data --console-address ":9001"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 4G
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_BROWSER_REDIRECT_URL=${MINIO_UI_URL}
      - JAVA_OPS=-Xmx4G
    ports:
      - ${MINIO_PORT}:9000
      - "9901:9001"
    networks:
      - sudian_network
    volumes:
      - sudian_minio_data:/data

  sudian-alerts-postgresql-v16:
    image: ${SUDIAN_ALERTS_POSTGRESQL_IMAGE_PATH}sudian-alerts-postgresql-v16:${TAG}
    container_name: sudian-alerts-postgresql-v16-${TAG}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 512M
    build:
      context: ./../sudian-alerts-postgresql-v16
      dockerfile: Dockerfile.elections
    environment:
      - PGUSER=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    logging:
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready", "-d", "sudian_alert" ]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s
    ports:
      - '5435:5432'
    networks:
      - sudian_network
    volumes:
      - sudian_alert_postgresql_v16_data:/var/lib/postgresql/data
    command: |
      postgres
        -c checkpoint_completion_target=0.9
        -c default_statistics_target=400
        -c effective_io_concurrency=200
        -c random_page_cost=1.0
        -c 'max_connections=${ALERTS_POSTGRESQL_MAX_CONNECTIONS}'

  sudian-dictionary-postgresql-v16:
    image: ${SUDIAN_DICTIONARY_POSTGRESQL_IMAGE_PATH}sudian-dictionary-postgresql-v16:${TAG}
    container_name: sudian-dictionary-postgresql-v16-${TAG}
    restart: unless-stopped
    build:
      context: ./../sudian-dictionary-postgresql-v16
      dockerfile: Dockerfile.elections
    environment:
      - PGUSER=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    logging:
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready", "-d", "sudian_dictionary" ]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s
    ports:
      - '5446:5432'
    networks:
      - sudian_network
    volumes:
      - sudian_dictionary_postgresql_v16_data:/var/lib/postgresql/data
    command: |
      postgres
        -c checkpoint_completion_target=0.9
        -c default_statistics_target=400
        -c effective_io_concurrency=200
        -c random_page_cost=1.0
        -c 'max_connections=${DICTIONARY_POSTGRESQL_MAX_CONNECTIONS}'

  sudian-face-recognition:
    image: ${SUDIAN_FACE_RECOGNITION_IMAGE_PATH}sudian-face-recognition:${TAG}
    container_name: sudian-face-recognition-${TAG}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
    environment:
      - TAG=${TAG}
      - KAFKA_BROKER_INTERNAL=${KAFKA_BROKER_INTERNAL}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_INTERNAL_ENDPOINT=${MINIO_INTERNAL_ENDPOINT}
      - JAVA_OPS=-Xmx2G
      - JAVA_OPTS=-XX:MaxRAMPercentage=88.0
      - OTEL_DISABLED=${OTEL_DISABLED}
      - OTEL_URL=${OTEL_URL}
      - OTEL_TRACES_SAMPLER_PROBABILITY=${OTEL_TRACES_SAMPLER_PROBABILITY}
    ports:
      - '16205:8080'
    networks:
      - sudian_network

  sudian-face-recognition-qdrant:
    image: ${SUDIAN_FACE_RECOGNITION_QDRANT_IMAGE_PATH}sudian-face-recognition-qdrant:${TAG}
    container_name: sudian-face-recognition-qdrant-${TAG}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 1G
    networks:
      - sudian_network
    volumes:
      - sudian_face_recognition_qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"

  redpanda-0:
    container_name: redpanda-0
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda-0:9092,external://${BASE_IP:-localhost}:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda-0:8082,external://${BASE_IP:-localhost}:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda-0:33145
      - --advertise-rpc-addr redpanda-0:33145
      - --mode dev-container
      - --default-log-level=info
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    restart: always
    volumes:
      - redpanda-0:/var/lib/redpanda/data
    ports:
      - 18081:18081
      - 18082:18082
      - 19092:19092
      - 19644:9644
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1'
    networks:
      - sudian_network

  redpanda-console:
    container_name: redpanda-console
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    restart: always
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda-0:9092"]
          schemaRegistry:
            enabled: true
            urls: ["http://redpanda-0:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda-0:9644"]
    ports:
      - 8883:8080
    networks:
      - sudian_network
    depends_on:
      - redpanda-0

volumes:
  sudian_keycloak_postgres_v16_data:
  sudian_postgresql_v16_data:
  sudian_analytics_v2_postgresql_v16_data:
  sudian_elastic_sources_certs:
    driver: local
  sudian_elastic_backup:
    driver: local
  sudian_elastic_sources_search_data:
    driver: local
  sudian_kibana_data:
    driver: local
  sudian_minio_data:
  sudian_alert_postgresql_v16_data:
  sudian_dictionary_postgresql_v16_data:
  sudian_dictionary_dict_data:
  sudian_face_recognition_qdrant_data:
  redpanda-0:

networks:
  sudian_network:
    name: sudian-network
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: "172.39.0.0/16"
